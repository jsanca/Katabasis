<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katabasis — Download Lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-soft:   #7a8399;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Katabasis</p>
    <h1>One download, from submit to completed event</h1>

    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dl-seq-title dl-seq-desc">
      <title id="dl-seq-title">Download lifecycle sequence</title>
      <desc id="dl-seq-desc">A client submits a download to DownloadManager, which registers it and hands it to a virtual-thread executor; the manager emits a started event, resolves a strategy, the strategy emits progress inside a loop, then a completed event, and the manager removes the task from the registry.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="100" y1="128" x2="100" y2="640" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="300" y1="128" x2="300" y2="640" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="128" x2="500" y2="640" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="128" x2="700" y2="640" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="128" x2="880" y2="640" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Loop fragment -->
      <rect x="688" y="392" width="204" height="112" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="688" y="392" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="708" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="700" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.04em">[per read buffer]</text>

      <!-- Activation bars -->
      <rect x="296" y="176" width="8" height="424" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="496" y="232" width="8" height="336" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="696" y="352" width="8" height="180" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <line x1="100" y1="184" x2="296" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="304" y1="216" x2="496" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="296" y1="248" x2="100" y2="248" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="496" y1="288" x2="304" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="304" y1="320" x2="880" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="304" y1="360" x2="696" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="704" y1="444" x2="880" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M704,476 H740 Q748,476 748,484 V492 Q748,500 740,500 H712"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="704" y1="536" x2="880" y2="536" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M304,576 H344 Q352,576 352,584 V588 Q352,596 344,596 H312"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Message labels -->
      <rect x="150" y="164" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">download(request)</text>

      <rect x="336" y="196" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">execute(runDownload)</text>

      <rect x="146" y="228" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">SubmissionResult</text>

      <rect x="340" y="268" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">runDownload(task)</text>

      <rect x="530" y="300" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">DownloadStartedEvent</text>

      <rect x="520" y="340" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">download(task, context)</text>

      <rect x="736" y="424" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="433" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">ProgressEvent</text>

      <rect x="756" y="480" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="800" y="489" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">awaitIfPaused</text>

      <rect x="736" y="516" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="808" y="525" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">DownloadCompletedEvent</text>

      <rect x="360" y="572" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="581" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">registry.remove</text>

      <!-- Actors -->
      <rect x="32" y="64" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="64" width="136" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="100" y="92" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="100" y="108" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">caller</text>

      <rect x="232" y="64" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="64" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="92" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">DownloadManager</text>
      <text x="300" y="108" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">Default…Manager</text>

      <rect x="432" y="64" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="64" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="92" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">DownloadExecutor</text>
      <text x="500" y="108" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">virtual thread</text>

      <rect x="632" y="64" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="64" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="92" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">DownloadStrategy</text>
      <text x="700" y="108" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">orchestrator + HTTP</text>

      <rect x="812" y="64" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="812" y="64" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="92" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Event listeners</text>
      <text x="880" y="108" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">Consumer&#60;DownloadEvent&#62;</text>

      <!-- Time axis -->
      <text x="56" y="672" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">TIME</text>
      <line x1="96" y1="668" x2="96" y2="688" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <line x1="96" y1="688" x2="904" y2="688" stroke="rgba(45,49,66,0.20)" stroke-width="1" marker-end="url(#arrow)"/>
    </svg>
  </div>
</body>
</html>
