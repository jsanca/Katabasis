<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katabasis — Module Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-soft:   #7a8399;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Katabasis</p>
    <h1>Four modules, one core, storage composed by both apps</h1>

    <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="module-map-title module-map-desc">
      <title id="module-map-title">Katabasis module map</title>
      <desc id="module-map-desc">Four JPMS modules: katabasis-cli and katabasis-ui each require katabasis-core and katabasis-storage-json, katabasis-storage-json requires katabasis-core, and katabasis-core depends on none of them.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows -->
      <line x1="352" y1="280" x2="272" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M672,176 H620 Q612,176 612,184 V244 Q612,252 604,252 H552"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M672,396 H620 Q612,396 612,388 V316 Q612,308 604,308 H552"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M772,112 V72 Q772,64 764,64 H180 Q172,64 172,72 V232"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M772,440 V480 Q772,488 764,488 H180 Q172,488 172,480 V328"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Core (focal) -->
      <rect x="72" y="232" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="232" width="200" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="172" y="268" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">katabasis-core</text>
      <text x="172" y="284" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">jsanca.katabasis.core</text>
      <text x="172" y="300" fill="#7a8399" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">download engine</text>

      <!-- Storage -->
      <rect x="352" y="232" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="352" y="232" width="200" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="452" y="268" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">katabasis-storage-json</text>
      <text x="452" y="284" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">jsanca.katabasis.storage.json</text>
      <text x="452" y="300" fill="#7a8399" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">checkpoint adapter</text>

      <!-- CLI -->
      <rect x="672" y="112" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="112" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="772" y="148" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">katabasis-cli</text>
      <text x="772" y="164" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">jsanca.katabasis.cli</text>
      <text x="772" y="180" fill="#7a8399" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">picocli commands</text>

      <!-- UI -->
      <rect x="672" y="352" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="352" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="772" y="388" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">katabasis-ui</text>
      <text x="772" y="404" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">jsanca.katabasis.ui</text>
      <text x="772" y="420" fill="#7a8399" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">JavaFX application</text>

      <!-- Labels -->
      <rect x="280" y="260" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">requires</text>

      <rect x="620" y="200" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="652" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">requires</text>

      <rect x="620" y="344" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="652" y="353" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">requires</text>

      <rect x="420" y="44" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="53" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">requires core API</text>

      <rect x="420" y="464" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="473" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">requires core API</text>

      <text x="72" y="536" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.06em">ALL ARROWS ARE JPMS REQUIRES · CORE HAS NO OUTGOING EDGE</text>
    </svg>
  </div>
</body>
</html>
