<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katabasis — Module Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-soft:   #7a8399;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Katabasis</p>
    <h1>Modules and the exported API boundary</h1>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="module-map-title module-map-desc">
      <title id="module-map-title">Katabasis module map</title>
      <desc id="module-map-desc">Three Maven modules: katabasis-ui requires the exported API of katabasis-core, katabasis-cli has a planned but undeclared dependency, and internal packages of the core depend on its exported api packages.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Core zone -->
      <rect x="320" y="64" width="320" height="300" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="336" y="76" width="184" height="14" rx="2" fill="#f5f5f5"/>
      <text x="428" y="86" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">KATABASIS-CORE · JPMS MODULE</text>

      <!-- Arrows first -->
      <line x1="240" y1="172" x2="360" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="252" x2="480" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="172" x2="600" y2="172" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- UI -->
      <rect x="64" y="128" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="128" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="168" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">katabasis-ui</text>
      <text x="152" y="184" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">jsanca.katabasis.ui</text>

      <!-- api -->
      <rect x="360" y="112" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="112" width="240" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="368" y="120" width="56" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="396" y="129" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">EXPORTED</text>
      <text x="480" y="152" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">api.*</text>
      <text x="480" y="168" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">event · exception · manager · model</text>

      <!-- internal -->
      <rect x="360" y="252" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="252" width="240" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="368" y="260" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="394" y="269" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">PRIVATE</text>
      <text x="480" y="292" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">internal.*</text>
      <text x="480" y="306" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">execution · strategy · http · s3</text>
      <text x="480" y="320" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">retry · model · util</text>

      <!-- CLI -->
      <rect x="720" y="128" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="128" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="808" y="164" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">katabasis-cli</text>
      <text x="808" y="180" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">jsanca.katabasis.cli</text>
      <text x="808" y="196" fill="#7a8399" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">stub</text>

      <!-- Arrow labels -->
      <rect x="276" y="152" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">requires</text>

      <rect x="488" y="216" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">depends on</text>

      <rect x="636" y="152" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">planned</text>

      <!-- Legend -->
      <line x1="64" y1="396" x2="896" y2="396" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">LEGEND</text>
      <line x1="168" y1="424" x2="208" y2="424" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="216" y="428" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">DECLARED DEPENDENCY</text>
      <line x1="420" y1="424" x2="460" y2="424" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="468" y="428" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">PLANNED</text>
    </svg>
  </div>
</body>
</html>
