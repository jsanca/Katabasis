<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katabasis — Core Collaborators</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-soft:   #7a8399;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Katabasis</p>
    <h1>Who executes a download</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="core-collab-title core-collab-desc">
      <title id="core-collab-title">Core download collaborators</title>
      <desc id="core-collab-desc">DownloadManager coordinates a DownloadRegistry, a DownloadExecutor, and a DownloadStrategyResolver, which returns an HttpDownloadOrchestrator that chooses between single-stream and segmented HTTP strategies.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first -->
      <path d="M248,248 H272 Q280,248 280,240 V144 Q280,136 288,136 H312"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="248" y1="272" x2="312" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M248,296 H272 Q280,296 280,304 V400 Q280,408 288,408 H312"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M152,224 V56 Q152,48 160,48 H656 Q664,48 664,56 V232"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M488,408 H520 Q528,408 528,400 V296 Q528,288 536,288 H576"
            fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M752,252 H780 Q788,252 788,244 V176 Q788,168 796,168 H824"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M752,292 H780 Q788,292 788,300 V384 Q788,392 796,392 H824"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Manager -->
      <rect x="56" y="224" width="192" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="224" width="192" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="262" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">DownloadManager</text>
      <text x="152" y="278" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">DefaultDownloadManager</text>
      <text x="152" y="294" fill="#7a8399" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">orchestration</text>

      <!-- Executor -->
      <rect x="312" y="96" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="96" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="128" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">DownloadExecutor</text>
      <text x="400" y="144" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">virtual threads · semaphore</text>

      <!-- Registry -->
      <rect x="312" y="232" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="232" width="176" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="400" y="264" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">DownloadRegistry</text>
      <text x="400" y="280" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">in-memory · ConcurrentHashMap</text>

      <!-- Resolver -->
      <rect x="312" y="368" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="368" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="400" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">StrategyResolver</text>
      <text x="400" y="416" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">HTTP/HTTPS by scheme</text>

      <!-- Orchestrator (focal) -->
      <rect x="576" y="232" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="232" width="176" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="664" y="260" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">HttpDownloadOrchestrator</text>
      <text x="664" y="276" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">probe Accept-Ranges</text>
      <text x="664" y="290" fill="#7a8399" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">single vs segmented</text>

      <!-- Single stream -->
      <rect x="824" y="128" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="824" y="128" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="904" y="160" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">HTTP strategy</text>
      <text x="904" y="176" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">HttpDownloadStrategy</text>

      <!-- Segmented -->
      <rect x="824" y="352" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="824" y="352" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="904" y="384" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Segmented strategy</text>
      <text x="904" y="400" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">SegmentedHttpDownloadStrategy</text>

      <!-- Arrow labels -->
      <rect x="288" y="184" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="193" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>

      <rect x="252" y="252" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">REGISTRY</text>

      <rect x="288" y="340" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="316" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">RESOLVE</text>

      <rect x="376" y="28" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="37" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">download()</text>

      <rect x="536" y="340" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="572" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">HTTP/HTTPS</text>

      <rect x="796" y="204" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">HTTP</text>

      <rect x="796" y="336" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="345" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">SEGMENTED</text>

      <!-- Legend -->
      <line x1="56" y1="488" x2="944" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">LEGEND</text>
      <line x1="160" y1="512" x2="200" y2="512" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="208" y="516" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">CALL / ASSOCIATION</text>
      <line x1="440" y1="512" x2="480" y2="512" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="488" y="516" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">RETURNS STRATEGY</text>
    </svg>
  </div>
</body>
</html>
